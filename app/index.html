<!DOCTYPE html>
<html lang="pt-BR">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Painel de Prospecção - Achando.Site</title>
 <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
 <style>
 :root { --bg: #0f1117; --surface: #1a1d2e; --primary: #7c5cfc; --text: #e8edf5; }
 body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; padding: 20px; display: flex; justify-content: center; }
 .container { max-width: 1000px; width: 100%; }
 h1 { color: var(--primary); text-align: center; }
 .search-box { background: var(--surface); padding: 20px; border-radius: 12px; display: flex; gap: 10px; margin-bottom: 20px; }
 input { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #2a2e42; background: #0f1117; color: white; }
 button { padding: 12px 24px; background: var(--primary); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
 button:hover { opacity: 0.9; }
 table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: 12px; overflow: hidden; }
 th, td { padding: 15px; text-align: left; border-bottom: 1px solid #2a2e42; }
 th { background: #232738; color: var(--primary); }
 </style>
</head>
<body>
 <div class="container">
 <h1>Prospecção IA</h1>
 <div class="search-box">
 <input type="text" id="nicho" placeholder="Ex: Dentistas, Advogados...">
 <input type="text" id="cidade" placeholder="Ex: São Paulo, Rio de Janeiro...">
 <button onclick="buscar()">Buscar Leads</button>
 </div>
 <table id="tabela">
 <thead><tr><th>Empresa</th><th>Cidade</th><th>Status</th><th>Ação</th></tr></thead>
 <tbody><!-- Resultados aparecerão aqui --></tbody>
 </table>
 </div>
 <script>
 function buscar() {
 const nicho = document.getElementById('nicho').value;
 const cidade = document.getElementById('cidade').value;
 const tbody = document.querySelector('#tabela tbody');
 tbody.innerHTML = '<tr><td colspan="4" style="text-align:center">Buscando...</td></tr>';

 // Simulação de dados (Aqui entraria sua lógica de API futuramente)
 setTimeout(() => {
 tbody.innerHTML = `
 <tr><td>${nicho || 'Empresa'} Exemplo</td><td>${cidade || 'Cidade'}</td><td>🟢 Sem Site</td><td><button style="padding:5px 10px; font-size:12px">Adicionar</button></td></tr>
 <tr><td>Comércio Local Ltda</td><td>${cidade || 'Região'}</td><td>🔴 Com Site</td><td><button style="padding:5px 10px; font-size:12px">Verificar</button></td></tr>
 `;
 }, 1000);
 }
 </script>
</body>
</html>
